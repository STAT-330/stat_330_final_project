name: Render and publish Quarto site

on:
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "ai-use.qmd"
      - "_quarto.yml"
      - "styles.css"
      - "Health_insurance.csv"
      - "**/*.qmd"
      - "**/*.R"
      - "**/*.csv"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quarto-pages
  cancel-in-progress: false

jobs:
  render-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R for the R code chunks in index.qmd
        uses: r-lib/actions/setup-r@v2

      - name: Install knitr
        run: Rscript -e 'install.packages("knitr", repos = "https://cloud.r-project.org")'

      - name: Create the file requested by _quarto.yml
        run: touch .nojekyll

      - name: Render the Quarto project into docs/
        run: quarto render

      - name: Save the rendered HTML files in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Rendered docs/ already matches the source files."
          else
            git commit -m "Render Quarto site"
            git push
          fi

      - name: Upload docs/ for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy the rendered site
        id: deployment
        uses: actions/deploy-pages@v4
